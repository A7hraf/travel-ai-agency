# Full stack: PostgreSQL + API + web app, plus optional parts chosen with
# COMPOSE_PROFILES in .env:
#   local-ai  Ollama running the open-source AI brain on this machine
#   https     Caddy with automatic HTTPS for your domain (online servers)
#
# On your computer:   cp .env.example .env && docker compose up -d --build
#                     then open http://localhost:8080
# On a server:        sudo bash deploy/install.sh   (asks a few questions, does the rest)

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-travel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-travel}
      POSTGRES_DB: ${POSTGRES_DB:-travel_ai}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-travel} -d ${POSTGRES_DB:-travel_ai}"]
      interval: 5s
      retries: 20

  # The AI brain. Runs on CPU; for faster replies use an NVIDIA GPU (see below).
  ollama:
    image: ollama/ollama:latest
    profiles: ["local-ai"]
    restart: unless-stopped
    volumes:
      - ollama:/root/.ollama
    # Uncomment to use an NVIDIA GPU (needs the NVIDIA Container Toolkit):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # One-off job: downloads the base model and builds the "travel-agent" model.
  ollama-setup:
    image: ollama/ollama:latest
    profiles: ["local-ai"]
    depends_on:
      - ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
      BASE_MODEL: ${BASE_MODEL:-qwen2.5:7b}
    volumes:
      - ./ai:/ai:ro
    entrypoint: ["/bin/sh", "/ai/setup-model.sh"]
    restart: "no"

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-travel}:${POSTGRES_PASSWORD:-travel}@db:5432/${POSTGRES_DB:-travel_ai}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://ollama:11434/v1}
      # nginx (the frontend service) sits in front and adds the visitor's address.
      TRUSTED_PROXY_HOPS: "1"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      # On a server the installer sets WEB_BIND=127.0.0.1 so only HTTPS (Caddy) is public.
      - "${WEB_BIND:-0.0.0.0}:${WEB_PORT:-8080}:80"
    depends_on:
      - backend

  # HTTPS for online servers: gets and renews a free Let's Encrypt certificate.
  caddy:
    image: caddy:2-alpine
    profiles: ["https"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend

volumes:
  pgdata:
  ollama:
  caddy_data:
  caddy_config:
