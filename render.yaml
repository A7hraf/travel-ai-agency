# Render Blueprint: the whole system as one free web service.
# Step-by-step guide: docs/DEPLOY_FREE.md
services:
  - type: web
    name: travel-ai-agency
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      # Postgres connection string from Neon (free, does not expire).
      - key: DATABASE_URL
        sync: false
      # Your platform-owner login, created on the first start.
      - key: SYSTEM_ADMIN_EMAIL
        sync: false
      - key: SYSTEM_ADMIN_PASSWORD
        sync: false
      # Demo company "Sunrise Travel" for a first look. Set to false before real use.
      - key: SEED_DEMO_DATA
        value: "true"
      # AI brain: open-source Llama 3.3 70B hosted by Groq (free tier).
      - key: LLM_PROVIDER
        value: openai_compatible
      - key: LLM_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: LLM_MODEL
        value: llama-3.3-70b-versatile
      - key: LLM_API_KEY
        sync: false
      # Shorter history = fewer tokens = more chats within the free AI limits.
      - key: LLM_MAX_HISTORY_MESSAGES
        value: "24"
      # Faster logins on the small free instance.
      - key: BCRYPT_ROUNDS
        value: "10"
      - key: WHATSAPP_VERIFY_TOKEN
        generateValue: true
