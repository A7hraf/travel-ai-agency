# Render Blueprint: the application as a single web service.
# Deployment guide: docs/OPERATIONS.md
services:
  - type: web
    name: ghanjah
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      # Set in the Render dashboard; never commit values.
      - key: DATABASE_URL
        sync: false
      - key: SYSTEM_ADMIN_EMAIL
        sync: false
      - key: SYSTEM_ADMIN_PASSWORD
        sync: false
      - key: SEED_DEMO_DATA
        value: "true"
      - key: LLM_PROVIDER
        value: openai_compatible
      - key: LLM_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: LLM_MODEL
        value: openai/gpt-oss-120b
      - key: LLM_FALLBACK_MODELS
        value: openai/gpt-oss-20b
      - key: LLM_REASONING_EFFORT
        value: low
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MAX_HISTORY_MESSAGES
        value: "20"
      - key: BCRYPT_ROUNDS
        value: "10"
      - key: TRUSTED_PROXY_HOPS
        value: "1"
      - key: WHATSAPP_VERIFY_TOKEN
        generateValue: true
